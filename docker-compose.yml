services:
  postgres:
    image: postgres:16-alpine
    container_name: serp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: serp
      POSTGRES_PASSWORD: serp_local_password
      POSTGRES_DB: serp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
